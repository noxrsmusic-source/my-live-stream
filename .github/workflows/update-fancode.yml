name: Sync FanCode HLS

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout my repo
        uses: actions/checkout@v4

      - name: Download latest files from FanCode fetcher
        run: |
          curl -L -o Fancode_hls_m3u8.Json \
            https://raw.githubusercontent.com/byte-capsule/FanCode-Hls-Fetcher/main/Fancode_hls_m3u8.Json
          curl -L -o Fancode_Live.m3u \
            https://raw.githubusercontent.com/byte-capsule/FanCode-Hls-Fetcher/main/Fancode_Live.m3u

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Fancode_hls_m3u8.Json Fancode_Live.m3u
          git diff --quiet && git diff --staged --quiet || git commit -m "Sync HLS links"
          git push
