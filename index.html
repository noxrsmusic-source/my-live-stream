<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rewarded Ads</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!--
    ============================================================
    MONETAG SDK  — Zone ID: 12008763
    ============================================================
    IMPORTANT: Neeche wala tag Monetag dashboard se copy kiya hua
    EXACT tag se replace karo. Dashboard → Sites → Zone 12008763
    → "SDK / Tag" section.

    SDK is zone ke liye `show_12008763` naam ka function banata hai.
    ============================================================
  -->
  <script
    src="//libtl.com/sdk.js"
    data-zone="12008763"
    data-sdk="show_12008763"
  ></script>

  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --accent: #2ea6ff;
      --ok: #22c55e;
      --err: #ef4444;
      --text: #e7eaf0;
      --muted: #8b93a7;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100%;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,.06);
    }
    .balance {
      font-size: 44px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -1px;
    }
    .balance small { font-size: 16px; color: var(--muted); font-weight: 500; margin-left: 6px; }
    .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
    .user { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, #2ea6ff, #7c3aed);
      display: grid; place-items: center; font-weight: 700; font-size: 18px;
      flex-shrink: 0;
    }
    .user-name { font-weight: 600; font-size: 16px; }
    .user-id { color: var(--muted); font-size: 13px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
      transition: transform .08s ease, opacity .2s ease;
    }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status {
      margin-top: 12px;
      font-size: 14px;
      text-align: center;
      min-height: 20px;
      color: var(--muted);
    }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .note { font-size: 12px; color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="card">
      <div class="user">
        <div class="avatar" id="avatar">?</div>
        <div>
          <div class="user-name" id="userName">Loading…</div>
          <div class="user-id" id="userId">—</div>
        </div>
      </div>
      <div class="label">Coins</div>
      <div class="balance" id="balance">0<small>coins</small></div>
    </div>

    <div class="card">
      <button id="watchBtn" disabled>Watch Ad (+5 coins)</button>
      <div class="status" id="status">Initializing…</div>
    </div>

    <div class="card">
      <div class="note">
        Reward sirf tab credit hota hai jab Monetag ka server hamare backend ko
        postback bhejta hai. Frontend se coins kabhi add nahi hote.
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
