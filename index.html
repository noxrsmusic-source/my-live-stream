<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ad Test — Coin Earn</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag SDK — Zone 12008763 -->
  <script
    src="https://libtl.com/sdk.js"
    data-zone="12008763"
    data-sdk="show_12008763"
  ></script>

  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --accent: #2ea6ff;
      --ok: #22c55e;
      --err: #ef4444;
      --text: #e7eaf0;
      --muted: #8b93a7;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,.06);
    }
    .balance {
      font-size: 48px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
    }
    .balance small {
      font-size: 16px;
      color: var(--muted);
      font-weight: 500;
      margin-left: 6px;
    }
    .label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .1em;
      font-weight: 700;
    }
    .user {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2ea6ff, #7c3aed);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 20px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .user-name {
      font-weight: 700;
      font-size: 16px;
    }
    .user-id {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 18px;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #2ea6ff, #7c3aed);
      cursor: pointer;
      transition: transform .08s ease, opacity .2s ease;
    }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .status {
      margin-top: 14px;
      font-size: 14px;
      text-align: center;
      min-height: 22px;
      color: var(--muted);
      line-height: 1.4;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .status.ok { color: var(--ok); font-weight: 600; }
    .status.err { color: var(--err); font-weight: 600; }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .note {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="card">
      <div class="user">
        <div class="avatar" id="avatar">?</div>
        <div>
          <div class="user-name" id="userName">Loading…</div>
          <div class="user-id" id="userId">—</div>
        </div>
      </div>
      <div class="label">Your Balance</div>
      <div class="balance" id="balance">0<small>coins</small></div>
    </div>

    <div class="card">
      <button id="watchBtn" disabled>🎬 Watch Ad — Earn 5 Coins</button>
      <div class="status" id="status">Initializing…</div>
    </div>

    <div class="card">
      <div class="note">
        🧪 <strong>Test Mode:</strong> Coins browser mein store ho rahe hain.
        Real earnings ke liye backend + Firebase postback chahiye.
      </div>
    </div>

  </div>

  <script>
/* ============================================================
   AD TEST — Browser Only
   ============================================================ */

const STORAGE_KEY = 'coin_earn_balance_v1';
const REWARD_COINS = 5;
const SDK_FN = 'show_12008763';

const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.disableVerticalSwipes?.();
  tg.setHeaderColor?.('#0f1115');
  tg.setBackgroundColor?.('#0f1115');
}

const el = {
  avatar: document.getElementById('avatar'),
  userName: document.getElementById('userName'),
  userId: document.getElementById('userId'),
  balance: document.getElementById('balance'),
  watchBtn: document.getElementById('watchBtn'),
  status: document.getElementById('status'),
};

let balance = 0;
let adInFlight = false;

function setStatus(html, kind = '') {
  el.status.innerHTML = html;
  el.status.className = 'status' + (kind ? ' ' + kind : '');
}

function loadBalance() {
  const raw = localStorage.getItem(STORAGE_KEY);
  const n = parseInt(raw, 10);
  balance = Number.isFinite(n) && n >= 0 ? n : 0;
  el.balance.innerHTML = `${balance}<small>coins</small>`;
}

function addCoins(n) {
  balance += n;
  localStorage.setItem(STORAGE_KEY, String(balance));
  el.balance.innerHTML = `${balance}<small>coins</small>`;
  el.balance.animate(
    [{ transform: 'scale(1)' }, { transform: 'scale(1.1)' }, { transform: 'scale(1)' }],
    { duration: 400 }
  );
}

function loadTelegramUser() {
  const u = tg?.initDataUnsafe?.user;
  if (!u) {
    el.userName.textContent = 'Telegram User';
    el.userId.textContent = 'Guest';
    el.avatar.textContent = '?';
    return;
  }
  el.userName.textContent = [u.first_name, u.last_name].filter(Boolean).join(' ') || 'User';
  el.userId.textContent = u.username ? '@' + u.username : 'ID: ' + u.id;
  if (u.photo_url) {
    el.avatar.innerHTML = `<img src="${u.photo_url}" alt="">`;
  } else {
    el.avatar.textContent = (u.first_name?.[0] || '?').toUpperCase();
  }
}

function showAd() {
  return new Promise((resolve, reject) => {
    const fn = window[SDK_FN];
    if (typeof fn !== 'function') {
      return reject(new Error('Monetag SDK load nahi hua. Zone 12008763 ka tag check karo.'));
    }

    let settled = false;
    const done = (ok, payload) => {
      if (settled) return;
      settled = true;
      clearTimeout(guard);
      ok ? resolve(payload) : reject(payload);
    };

    const guard = setTimeout(() => done(false, new Error('Ad timeout (2 min)')), 120000);

    const ymid = 'test_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10);
    console.log('[AD] ymid:', ymid);

    try {
      const p = fn({
        ymid,
        onReward: () => done(true, { via: 'onReward' }),
        onClose: () => done(true, { via: 'onClose' }),
        onError: (e) => done(false, e || new Error('SDK error')),
      });
      if (p && typeof p.then === 'function') {
        p.then((r) => done(true, r)).catch((e) => done(false, e));
      } else {
        // fallback: promise nahi, 8s baad maan lo complete
        setTimeout(() => done(true, { via: 'fallback' }), 8000);
      }
    } catch (e) {
      done(false, e);
    }
  });
}

async function handleWatchAd() {
  if (adInFlight) return;
  adInFlight = true;
  el.watchBtn.disabled = true;

  try {
    setStatus('<span class="spinner"></span>Ad load ho raha hai…');
    await showAd();
    setStatus('<span class="spinner"></span>Reward add ho raha hai…');
    await new Promise((r) => setTimeout(r, 400));
    addCoins(REWARD_COINS);
    setStatus(`🎉 +${REWARD_COINS} coins mil gaye!`, 'ok');
    tg?.HapticFeedback?.notificationOccurred('success');
  } catch (e) {
    console.error('[watchAd]', e);
    setStatus(e?.message || 'Ad fail ho gaya.', 'err');
    tg?.HapticFeedback?.notificationOccurred('error');
  } finally {
    adInFlight = false;
    el.watchBtn.disabled = false;
  }
}

loadBalance();
loadTelegramUser();
el.watchBtn.disabled = false;
setStatus('Ready — ad dekh ke test karo! 🚀', 'ok');

el.watchBtn.addEventListener('click', handleWatchAd);
  </script>
</body>
</html>
